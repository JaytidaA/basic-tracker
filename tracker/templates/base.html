<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tracker{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    nav { display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem; }
    nav form { display: inline; margin-left: auto; }
    table { width: 100%; border-collapse: collapse; }
    td, th { padding: .5rem; border-bottom: 1px solid #ddd; text-align: left; }
    .me { font-weight: bold; background: #f4f4f4; }
    .out { color: #b00; }
    .in { color: #080; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'leaderboard:home' %}">Home</a>
    {% if user.is_authenticated %}
      <a href="{% url 'password_change' %}">Change password</a>
      <span>{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Log out</button></form>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
