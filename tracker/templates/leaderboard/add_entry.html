{% extends "base.html" %}
{% block content %}
<h2>Add entry: {{ tracking.name }}</h2>
{% if tracking.kind == "elim" %}<p><strong>This eliminates you.</strong></p>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}<button>Submit</button></form>
<a href="{% url 'leaderboard:detail' tracking.pk %}">Cancel</a>
{% endblock %}
